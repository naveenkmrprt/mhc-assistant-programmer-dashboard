# ============================================================
# PRODUCTION CONFIGURATION (PostgreSQL on Render)
# Set DATABASE_URL env var in Render dashboard:
# Format: postgresql://USER:PASSWORD@HOST:PORT/DBNAME
# ============================================================

# Derive JDBC URL from Render's standard DATABASE_URL format
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in prod
spring.h2.console.enabled=false

# Seed data only if empty (prevent re-seeding on restart)
spring.sql.init.mode=never

# Server (Render sets PORT env var automatically)
server.port=${PORT:8080}

# CORS: Set ALLOWED_ORIGINS env var in Render to your Netlify URL
# e.g., ALLOWED_ORIGINS=https://mhc-ap-sprint.netlify.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://mhc-ap-sprint.netlify.app}
